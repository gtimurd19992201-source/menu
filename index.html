<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e0d">
<title>Высокий градус — меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="premium.css">
</head>
<body>
<div class="app">
<header class="topbar"><div id="leftSlot"><div class="monogram">ВГ</div></div><div class="center" id="topTitle">ВЫСОКИЙ ГРАДУС</div><div id="rightSlot"><div class="burger" aria-hidden="true"><i></i><i></i><i></i></div></div></header>
<main id="homeView">
<section class="hero"><h1>ВЫСОКИЙ<br>ГРАДУС</h1><div class="menu-word">МЕНЮ</div><p class="tag">Что есть • что пить • что запомнится</p></section>
<div class="category-board" aria-label="Разделы меню"><div class="category-grid">
<button type="button" data-section="nastoyki" aria-label="Настойки"></button>
<button type="button" data-section="cocktails" aria-label="Коктейли"></button>
<button type="button" data-section="shots" aria-label="Шоты"></button>
<button type="button" data-section="food" aria-label="Кухня"></button>
<button type="button" data-section="drinks" aria-label="Напитки"></button>
<button type="button" data-section="hookah" aria-label="Кальян"></button>
</div></div>
<div class="home-foot">ВЫСОКИЙ ГРАДУС — ВЫШЕ ОЖИДАНИЙ</div>
</main>
<main class="section-view" id="sectionView">
<nav class="tabs" aria-label="Разделы меню">
<button class="tab" type="button" data-section="nastoyki">НАСТОЙКИ</button>
<button class="tab" type="button" data-section="cocktails">КОКТЕЙЛИ</button>
<button class="tab" type="button" data-section="shots">ШОТЫ</button>
<button class="tab" type="button" data-section="food">КУХНЯ</button>
<button class="tab" type="button" data-section="drinks">НАПИТКИ</button>
<button class="tab" type="button" data-section="hookah">КАЛЬЯН</button>
</nav>
<section class="section" id="sectionContent"></section>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
